let S={cfg:DEF,matches:{}},put,$=s=>document.querySelector(s);

const T=id=>S.cfg.teams.find(t=>t.id==id)||{name:'?',color:'#888'};
const P=id=>S.cfg.players.find(p=>p.id==id);

const evs=m=>m.ev||[], ms=()=>Object.values(S.matches||{});

function calc(m,i){let r=0,w=0,b=0;evs(m).filter(e=>e.i==i).forEach(e=>{const f=e.b?2:1;
 if(e.k=='r'){r+=e.r*f;b++}else if(e.k=='w'){w++;r+=(e.r||0)*f-5;b++}else r++});const bt=batT(m,i);Object.values(m.bon||{}).forEach(x=>{if(x.team==bt)r+=x.r});return{r,w,b}}

/* ===== VIEWS ===== */
function chips(m){return evs(m).filter(e=>e.i==m.inn).slice(-8).map(e=>{
 const t=e.k=='w'?'W':e.k=='wd'?'Wd':e.k=='nb'?'Nb':e.r*(e.b?2:1),c=e.k=='w'?'w':e.k=='r'?(e.r>=4?'b':''):'x';
 return `<span class="chip ${c} ${e.b&&e.k=='r'?'boom':''}">${t}</span>`}).join('')||'<span class="mut">No balls yet</span>'}
const init=n=>n.split(/[\s']+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=x=>x.logo?`<img class="av" src="${x.logo}" alt="">`:`<span class="av" style="--c:${x.color}">${esc(init(x.name))}</span>`;
const fmt=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
const dtxt=e=>{const w=e.w||{t:'b'},bn=pn(e.o),f=w.f?pn(w.f):'—';return({b:`b ${bn}`,ct:`c ${f} b ${bn}`,cb:`c & b ${bn}`,lbw:`lbw b ${bn}`,ro:`run out (${f})`,st:`st ${f} b ${bn}`,hw:`hit wicket b ${bn}`})[w.t]||`b ${bn}`};
const bowledOf=(m,i)=>{const c=m.cur||{},u=new Set();evs(m).filter(e=>e.i==i).forEach(e=>u.add(e.o));u.delete('');u.delete(undefined);u.delete(c.o);return[...u]};
const fhit=(m,i)=>{const a=evs(m).filter(e=>e.i==i);for(let j=a.length-1;j>=0;j--){if(a[j].k=='wd')continue;return a[j].k=='nb'}return false};
const outsOf=(m,i)=>{const c=m.cur||{},u=new Set();evs(m).filter(e=>e.i==i).forEach(e=>{u.add(e.s);(e.p||[]).slice(0,2).forEach(x=>u.add(x))});u.delete('');u.delete(undefined);u.delete(c.s);u.delete(c.n);return[...u]};
const BD={w:'WICKET',six:'SIX',four:'FOUR',run:'RUN',x:'EXTRA',cm:'COMMENT',bn:'BONUS'};
function feed(m){const out=[],b={1:0,2:0},nm=T(m.t1).name+' '+T(m.t2).name;
 const add=(k,q,ty,tx,lab,i,t)=>{const bt=T(batT(m,i));tx=`<b style="color:${bt.color}">${esc(bt.name)}</b> · ${tx}`;
  out.push({k,q,ty,tx,lab,col:bt.color,turf:m.turf,teams:[m.t1,m.t2],time:t?fmt(t):'',pl:tx.replace(/<[^>]+>/g,'')+' '+nm})};
 evs(m).forEach((e,q)=>{const f=e.b?2:1,leg=e.k=='r'||e.k=='w',sn=pn(e.s),bn=pn(e.o);let ty='run',tx;
  if(leg)b[e.i]++;const lab=ov(b[e.i])+(leg?'':'+');

function card(t){
 const m=turfM(t),tag=m&&m.status=='live'?'<span class="pill live">● LIVE</span>':m&&m.status=='done'?'<span class="pill">FINAL</span>':m?'<span class="pill">RESULT PENDING</span>':'',

 const i=m.inn,bt=T(batT(m,i)),bw=T(bowT(m,i)),c=calc(m,i),c1=calc(m,1),c2=calc(m,2),crr=c.b?(c.r*6/c.b):0;let line,bx;
 const B=(a,b)=>`<div><small>${a}</small><b>${b}</b></div>`;

 else{line=`Setting a target · ${bt.name} batting first`;bx=B('Overs',`${ov(c.b)}/${OVERS}`)+B('Run rate',crr.toFixed(1))+B('Projected',c.b?Math.round(c.r*BALLS/c.b):0)}
 const cu=m.cur||{},pct=Math.min(100,c.b*100/BALLS),lE=evs(m).filter(e=>e.i==i&&e.k=='w').pop(),lw=lE?`${pn((lE.w||{x:lE.s}).x)} ${dtxt(lE)}`:'';
 return `<section class="card ${m.status=='live'?'live':''}" style="--c:${bt.color}">${h}
 <div class="mh">${av(bt)}<div><div class="tn">${esc(bt.name)}</div><div class="vs">vs ${esc(bw.name)} · Innings ${i}</div></div><div class="big">${c.r}/${c.w}<small>${ov(c.b)} OVERS</small></div></div>
 <div class="sb">${bx}</div>
 <div class="row"><span class="pill">🏏 <b>${pn(cu.s)}*</b></span><span class="pill">🏏 ${pn(cu.n)}</span><span class="pill">⚾ ${pn(cu.o)}</span>${bonusOf(m,bt.id)?`<span class="pill">🎁 ${bonusOf(m,bt.id)>0?'+':''}${bonusOf(m,bt.id)} bonus</span>`:''}${m.status=='live'&&fhit(m,i)?'<span class="pill" style="background:var(--bad);color:#fff;border-color:var(--bad)">🎯 FREE HIT</span>':''}${m.boom&&m.status=='live'?'<span class="pill" style="background:var(--acc);color:#000;border-color:var(--acc)">💥 BOOM-BOOM BALL</span>':''}</div>
 ${lw?`<div class="cap" style="margin-top:12px"><span>Last wicket: <b style="color:var(--txt)">${lw}</b></span></div>`:''}
 <div class="bar"><i style="width:${pct}%"></i></div><div class="cap"><span>Overs used</span><span>${Math.round(pct)}%</span></div>
 <div class="row">${chips(m)}</div><div class="line">${line}</div></section>`}
const live=()=>`<div class="layout"><div><h2 class="sec">TURFS</h2><div class="grid">${card('A')}${card('B')}</div></div>${activity()}</div>`;

function standings(){
 const r={};S.cfg.teams.forEach(t=>r[t.id]={t,p:0,w:0,l:0,rf:0,bf:0,ra:0,ba:0,wl:0});
 ms().filter(m=>m.status=='done'&&r[m.winner]).forEach(m=>{[1,2].forEach(i=>{const c=calc(m,i),a=r[batT(m,i)],d=r[bowT(m,i)];
  a.rf+=c.r;a.bf+=c.b;a.wl+=c.w;d.ra+=c.r;d.ba+=c.b});
  [m.t1,m.t2].forEach(id=>{r[id].p++;m.winner==id?r[id].w++:r[id].l++})});
 return Object.values(r).map(x=>({...x,pts:x.w*2,rd:x.rf-x.ra,nrr:(x.bf?x.rf*6/x.bf:0)-(x.ba?x.ra*6/x.ba:0)}))
  .sort((a,b)=>b.pts-a.pts||b.rd-a.rd||a.wl-b.wl)}
const table=()=>`<section class="card"><div class="th">POINTS TABLE</div><table><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th><th>RD</th><th>Wkts</th></tr>
 ${standings().map((x,i)=>`<tr style="--c:${x.t.color}"><td><span class="dot"></span>${i+1}. ${esc(x.t.name)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.pts}</b></td><td>${x.rd>0?'+':''}${x.rd}</td><td>${x.wl}</td></tr>`).join('')}</table>
 <p class="mut" style="margin-top:8px;font-size:12px">Ranked by points, then total run difference (RD) across all matches, then fewer wickets lost (Wkts).</p></section>`;

function stats(){const s={},g=id=>s[id]||(s[id]={r:0,bf:0,f:0,x:0,w:0,rc:0,bb:0});
 ms().forEach(m=>evs(m).forEach(e=>{const f=e.b?2:1,a=g(e.s),o=g(e.o);
  if(e.k=='r'){a.r+=e.r*f;a.bf++;e.r==4&&a.f++;e.r==6&&a.x++;o.rc+=e.r*f;o.bb++}
  else if(e.k=='w'){const w=e.w||{t:'b'};a.bf++;a.r+=(e.r||0)*f;o.rc+=(e.r||0)*f;if(w.t!='ro')o.w++;o.bb++}else o.rc++}));return s}
function awards(){
 const st=stats(),cmp=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!=b[i])return b[i]-a[i];return 0};
 const box=(title,g,ok,sc,fm)=>{const l=S.cfg.players.filter(p=>(!g||p.g==g)&&st[p.id]&&ok(st[p.id])).sort((a,b)=>cmp(sc(st[a.id]),sc(st[b.id]))).slice(0,3);
  return `<section class="card aw"><h3>${title}</h3>${l.length?'<ul>'+l.map((p,i)=>`<li style="--c:${T(p.team).color}"><span>${['🥇','🥈','🥉'][i]} <span class="dot"></span>${esc(p.name)}</span><span class="mut">${fm(st[p.id])}</span></li>`).join('')+'</ul>':'<p class="mut">No data yet</p>'}</section>`};
 const bat=[s=>s.bf>0,s=>[s.r,s.bf?s.r/s.bf:0],s=>`${s.r} runs · SR ${(s.r*100/s.bf).toFixed(0)}`];
 const bowl=[s=>s.bb>0,s=>[s.w,s.bb?-s.rc/s.bb:0],s=>`${s.w} wkts · Econ ${(s.rc*6/s.bb).toFixed(1)}`];
 return `<div class="grid">${box('🏏 Best Batsman — Men','M',...bat)}${box('🏏 Best Batsman — Women','F',...bat)}
 ${box('⚾ Best Bowler — Men','M',...bowl)}${box('⚾ Best Bowler — Women','F',...bowl)}
 ${box('💥 Highest Boundaries','',s=>s.f+s.x>0,s=>[s.f+s.x,s.x],s=>`${s.f+s.x} (${s.f}×4, ${s.x}×6)`)}
 ${box('⭐ Best All-Rounder','',s=>s.bf>0&&s.bb>0,s=>[s.r*AR.run+s.w*AR.wkt],s=>`${s.r} runs + ${s.w} wkts = ${s.r*AR.run+s.w*AR.wkt} pts`)}</div>
 <p class="mut" style="font-size:12px">Boom-Boom doubled runs count toward batting/bowling totals. All-rounder = runs×${AR.run} + wickets×${AR.wkt} (needs at least one ball batted and bowled).</p>`}

/* ===== SCORER ===== */
const opts=(team,sel,ex=[],lab='batted')=>{const pl=S.cfg.players.filter(p=>p.team==team),o=p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.name)}${ex.includes(p.id)?` (${lab})`:''}</option>`,
 a=pl.filter(p=>!ex.includes(p.id)),b=pl.filter(p=>ex.includes(p.id));
 return `<option value="">— select —</option>`+a.map(o).join('')+(b.length?`<optgroup label="Already ${lab} (only if needed as replacement)">${b.map(o).join('')}</optgroup>`:'')};
function scorer(t){
 const m=turfM(t),tt=S.cfg.teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 if(!m||m.status=='done')return newMatch(t);
 const i=m.inn,c=calc(m,i),c1=calc(m,1),cu=m.cur||{},bt=batT(m,i),bw=bowT(m,i),lv=m.status=='live',full=c.b>=BALLS||(i==2&&c.r>c1.r);
 let sug='';if(m.status=='finished'||(i==2&&full)){const c2=calc(m,2);sug=c2.r>c1.r?batT(m,2):c1.r>c2.r?batT(m,1):'';}
 const b=(l,k,r,cl='')=>`<button class="${cl}" ${lv?'':'disabled'} onclick="act('${t}','${k}',${r})">${l}</button>`;
 return `<section class="card" style="--c:${T(bt).color}"><div class="th"><span>TURF ${t} — SCORER</span><span class="pill live">${m.status.toUpperCase()}</span></div>
 <div class="vs"><span class="tn">${esc(T(bt).name)}</span> vs ${esc(T(bw).name)} · Innings ${i}${i==2?` · Target ${c1.r+1}`:''}</div>
 <div class="score">${c.r}<small>/${c.w}</small> <small>(${ov(c.b)}/${OVERS})</small></div>
 <div class="row">${chips(m)}</div><p class="hint">${lv&&fhit(m,i)?'🎯 FREE HIT — only a run out is possible. ':''}${!lv?'Innings over — tap the winning team at the bottom to finish the match':full?'Overs complete — tap End Innings':!cu.s?'Choose the striker — a new pair bats every 2 overs':!cu.n?'Choose the non-striker':!cu.o?'Choose the bowler for this over':`Tap the runs after every ball · ${12-c.b%12} balls left for this pair`}</p>
 <div class="sel"><div><label>Striker</label><select class="${cu.s?'':'need'}" onchange="cur('${t}','s',this.value)">${opts(bt,cu.s,outsOf(m,i),'batted')}</select></div>
 <div><label>Non-striker</label><select class="${cu.n?'':'need'}" onchange="cur('${t}','n',this.value)">${opts(bt,cu.n,outsOf(m,i),'batted')}</select></div>
 <div><label>Bowler</label><select class="${cu.o?'':'need'}" onchange="cur('${t}','o',this.value)">${opts(bw,cu.o,bowledOf(m,i),'bowled')}</select></div></div>
 ${wpanel(t,cu,bw)}
 <div class="btns">${b('0','r',0)}${b('1','r',1)}${b('2','r',2)}${b('3','r',3)}${b('4','r',4,'r4')}${b('6','r',6,'r6')}<button class="wk" ${lv?'':'disabled'} onclick="openW('${t}')">WICKET −5</button>
 <button class="${m.boom?'on':''}" ${lv?'':'disabled'} onclick="boom('${t}')">💥 BOOM ${m.boom?'ON':'off'}</button>
 ${b('Wide +1','wd',0,'ex')}${b('No-ball +1','nb',0,'ex')}<button ${lv?'':'disabled'} onclick="undo('${t}')">↶ Undo</button><button class="sm" onclick="abandon('${t}')">Abandon</button></div>
 <div class="btns" style="grid-template-columns:1fr 1fr"><button class="sm" ${lv?'':'disabled'} onclick="endInn('${t}')">End Innings</button><span></span></div>
 <div class="th" style="margin-top:14px">LIVE COMMENT (shown to spectators)</div>
 <div class="row"><input id="cm_${t}" placeholder="Type a comment…" style="flex:1;min-width:0"><button class="sm on" onclick="post('${t}')">Post</button></div>
 <div class="row">${['Drinks break','Review','Rain delay','Great catch!','Change of bowler'].map(x=>`<button class="sm" onclick="post('${t}',this.textContent)">${x}</button>`).join('')}</div>
 ${(m.cm||[]).length?`<div class="row mut">Last: “${esc(m.cm[m.cm.length-1].t)}” <button class="sm" onclick="delC('${t}')">Delete</button></div>`:''}
 <div class="th" style="margin-top:14px">DECLARE WINNER${sug?` · suggested: ${esc(T(sug).name)}`:''}</div>
 <div class="btns" style="grid-template-columns:1fr 1fr"><button class="sm" style="border-color:${T(m.t1).color}" onclick="win('${t}','${m.t1}')">${esc(T(m.t1).name)}</button><button class="sm" style="border-color:${T(m.t2).color}" onclick="win('${t}','${m.t2}')">${esc(T(m.t2).name)}</button></div></section>`}
const save=m=>{put('matches/'+m.id,m);draw(2)};
const NM={A:{sel:[],first:''},B:{sel:[],first:''}};
function newMatch(t){const n=NM[t],o=t=='A'?'B':'A',busy=id=>ms().some(m=>m.turf!=t&&m.status!='done'&&(m.t1==id||m.t2==id));
 const ch=(x,on,fn,dis)=>`<button class="tc ${on?'on':''}" style="--c:${x.color}" ${dis?'disabled':''} onclick="${fn}"><span class="dot"></span>${esc(x.name)}${dis?` · playing on Turf ${o}`:''}</button>`;
 return `<section class="card"><div class="th">TURF ${t} — NEW MATCH</div>
 <p class="hint">Step 1 · Tap the two teams playing on this turf</p>
 <div class="cg">${S.cfg.teams.map(x=>ch(x,n.sel.includes(x.id),`pickT('${t}','${x.id}')`,busy(x.id))).join('')}</div>
 ${n.sel.length==2?`<p class="hint">Step 2 · Which team bats first?</p><div class="cg">${n.sel.map(id=>ch(T(id),n.first==id,`pickF('${t}','${id}')`)).join('')}</div>`:''}
 ${n.first?`<div class="btns" style="grid-template-columns:1fr"><button class="on" onclick="start('${t}')">▶ Start Match — ${esc(T(n.first).name)} bat first</button></div>`:''}</section>`}
function pickT(t,id){const n=NM[t],i=n.sel.indexOf(id);if(i>=0)n.sel.splice(i,1);else if(n.sel.length<2)n.sel.push(id);else n.sel=[n.sel[1],id];n.first='';draw(2)}
function pickF(t,id){NM[t].first=id;draw(2)}
function start(t){const n=NM[t],a=n.first,b=n.sel.find(x=>x!=a);if(!a||!b)return;
 const id='m'+Date.now();NM[t]={sel:[],first:''};save({id,turf:t,n:Date.now(),t1:a,t2:b,bat1:a,status:'live',inn:1,ev:[],cur:{s:'',n:'',o:''},boom:false})}
const WS={A:null,B:null};
function openW(t){const m=turfM(t),c=m.cur||{};if(!c.s||!c.n||!c.o)return alert('Choose the striker, non-striker and bowler first');if(calc(m,m.inn).b>=BALLS)return alert('Overs complete — tap End Innings');WS[t]={t:fhit(m,m.inn)?'ro':'',f:'',x:'s',r:0};draw(2)}
function confirmW(t){const w=WS[t],m=turfM(t),c=m.cur;if(!w||!w.t)return;const x=(w.t=='ro'&&w.x=='n')?c.n:c.s;
 const info={t:w.t,f:['ct','st','ro'].includes(w.t)?w.f:'',x};WS[t]=null;act(t,'w',w.t=='ro'?w.r:0,info)}
function wpanel(t,cu,bwT){const w=WS[t];if(!w)return '';const mm=turfM(t)||{},fh=fhit(mm,mm.inn);
 const fl=k=>`<select style="width:100%;margin-top:6px" onchange="WS['${t}'].f=this.value;draw(2)"><option value="">— select fielder —</option>${S.cfg.players.filter(p=>p.team==bwT).map(p=>`<option value="${p.id}" ${p.id==w.f?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
 const TY=[['b','Bowled'],['ct','Caught'],['cb','Caught & bowled'],['lbw','LBW'],['ro','Run out'],['st','Stumped'],['hw','Hit wicket']].filter(([k])=>!fh||k=='ro');
 const ok=w.t&&(w.t!='ct'&&w.t!='st'||w.f);
 const tb=(k,n,on,fn)=>`<button class="tc ${on?'on':''}" style="--c:var(--bad)" onclick="${fn}">${n}</button>`;
 return `<div class="card" style="--c:var(--bad);margin-top:12px"><div class="th"><span>WICKET — HOW WAS HE OUT?${fh?' · FREE HIT: run out only':''}</span><button class="sm" onclick="WS['${t}']=null;draw(2)">Cancel</button></div>
 <div class="cg">${TY.map(([k,n])=>tb(k,n,w.t==k,`WS['${t}'].t='${k}';WS['${t}'].f='';draw(2)`)).join('')}</div>
 ${w.t=='ct'?`<div class="hint">Who took the catch?</div>${fl()}`:''}${w.t=='st'?`<div class="hint">Who is the wicket-keeper?</div>${fl()}`:''}
 ${w.t=='ro'?`<div class="hint">Who is run out?</div><div class="cg">${tb('s',pn(cu.s)+' (striker)',w.x=='s',`WS['${t}'].x='s';draw(2)`)}${tb('n',pn(cu.n)+' (non-striker)',w.x=='n',`WS['${t}'].x='n';draw(2)`)}</div>
  <div class="hint">Runs completed before the run-out</div><div class="cg">${[0,1,2,3].map(r=>tb(r,r,w.r==r,`WS['${t}'].r=${r};draw(2)`)).join('')}</div><div class="hint">Fielder who made the run-out (optional)</div>${fl()}`:''}
 <div class="btns" style="grid-template-columns:1fr"><button class="wk" ${ok?'':'disabled'} onclick="confirmW('${t}')">Confirm wicket (−5 runs)</button></div></div>`}
function post(t,q){const m=turfM(t),el=$('#cm_'+t),x=(q||(el&&el.value)||'').trim();if(!m||!x)return;m.cm=[...(m.cm||[]),{at:evs(m).length,i:m.inn,t:x,n:Date.now()}];save(m)}
function delC(t){const m=turfM(t);m.cm=(m.cm||[]).slice(0,-1);save(m)}
function cur(t,k,val){const m=turfM(t);m.cur={...(m.cur||{}),[k]:val};save(m)}
const BN={mid:''};
function addBonus(){const m=ms().find(x=>x.id==$('#bn_m').value),r=Math.round(Number($('#bn_r').value));if(!m)return;if(!r)return alert('Type the bonus runs first (use a minus sign for a penalty)');
 m.bon=[...Object.values(m.bon||{}),{id:Date.now(),team:$('#bn_t').value,r,why:$('#bn_w').value.trim(),n:Date.now(),at:evs(m).length}];save(m)}
function delBonus(mid,id){const m=ms().find(x=>x.id==mid);if(!m)return;m.bon=Object.values(m.bon||{}).filter(x=>x.id!=id);save(m)}
function bonusView(){const L=ms().sort((a,b)=>b.n-a.n);
 if(!L.length)return `<section class="card"><div class="th">BONUS RUNS</div><p class="mut" style="margin-top:14px">No matches yet. Start a match, then add bonus runs here.</p></section>`;
 const m=L.find(x=>x.id==BN.mid)||L[0],st=x=>x.status=='done'?'Final':x.status=='live'?'Live':'Result pending',lab=x=>`Turf ${x.turf} · ${esc(T(x.t1).name)} vs ${esc(T(x.t2).name)} · ${st(x)}`;
 const all=L.flatMap(x=>Object.values(x.bon||{}).map(b=>({x,b})));
 return `<div class="grid"><section class="card"><div class="th">GIVE BONUS RUNS</div><p class="hint">Pick the match and team, type the runs (use − for a penalty). It is added to that team's innings score.</p>
 <div class="sel"><div><label>Match</label><select id="bn_m" onchange="BN.mid=this.value;draw(2)" style="width:100%">${L.map(x=>`<option value="${x.id}" ${x.id==m.id?'selected':''}>${lab(x)}</option>`).join('')}</select></div>
 <div><label>Team</label><select id="bn_t" style="width:100%"><option value="${m.t1}">${esc(T(m.t1).name)}</option><option value="${m.t2}">${esc(T(m.t2).name)}</option></select></div>
 <div><label>Runs</label><input id="bn_r" type="number" inputmode="numeric" placeholder="e.g. 5" style="width:100%"></div>
 <div><label>Reason (optional)</label><input id="bn_w" placeholder="e.g. Fair play" style="width:100%"></div></div>
 <div class="btns" style="grid-template-columns:1fr"><button class="on" onclick="addBonus()">＋ Add bonus runs</button></div></section>
 <section class="card"><div class="th">ALL BONUS / PENALTY ENTRIES</div>${all.length?all.map(({x,b})=>`<div class="row"><span class="dot" style="--c:${T(b.team).color}"></span><span style="flex:1;min-width:0"><b>${esc(T(b.team).name)}</b>: <b style="color:var(--acc)">${b.r>0?'+':''}${b.r}</b>${b.why?' · '+esc(b.why):''}<br><small class="mut">${lab(x)}</small></span><button class="sm" onclick="delBonus('${x.id}',${b.id})">✕</button></div>`).join(''):'<p class="mut" style="margin-top:14px">No bonus runs given yet.</p>'}</section></div>`}
function boom(t){const m=turfM(t);m.boom=!m.boom;save(m)}
function act(t,k,r,wi){const m=turfM(t),c=m.cur||{},cc=calc(m,m.inn),leg=k=='r'||k=='w';
 if(cc.b>=BALLS)return alert('Overs complete — tap End Innings');
 if(leg?(!c.s||!c.n||!c.o):!c.o)return alert(leg?'Choose the striker, non-striker and bowler first':'Choose the bowler first');
 if(c.s&&c.s==c.n)return alert('Striker and non-striker cannot be the same player');
 if(k=='w'&&fhit(m,m.inn)&&(!wi||wi.t!='ro'))return alert('Free hit — only a run out is possible');
 m.ev=[...evs(m),{t:Date.now(),i:m.inn,k,r,b:m.boom?1:0,s:c.s,o:c.o,p:[c.s,c.n,c.o],...(wi?{w:wi}:{})}];
 let s=c.s,n=c.n,o=c.o;
 if(k=='r'&&r%2)[s,n]=[n,s];
 if(leg){const b=cc.b+1;m.boom=b%6==2;if(b%6==0){[s,n]=[n,s];o='';if(b%12==0&&b<BALLS){s='';n=''}}}
 m.cur={s,n,o};save(m)}
function undo(t){const m=turfM(t),a=evs(m),e=a[a.length-1];
 if(!e||e.i!=m.inn)return alert('Nothing to undo in this innings');
 m.ev=a.slice(0,-1);m.cur={s:e.p[0],n:e.p[1],o:e.p[2]};m.boom=!!e.b;save(m)}
function endInn(t){const m=turfM(t);if(!confirm(m.inn==1?'End 1st innings and start chase?':'End match innings?'))return;
 if(m.inn==1){m.inn=2;m.cur={s:'',n:'',o:''};m.boom=false}else m.status='finished';save(m)}
function win(t,id){const m=turfM(t);if(!confirm('Declare '+T(id).name+' the winner of this match?'))return;m.status='done';m.winner=id;save(m)}
function abandon(t){const m=turfM(t);if(confirm('Delete this match and all its balls?'))put('matches/'+m.id,null)}

function cfg(fn){const c=JSON.parse(JSON.stringify(S.cfg));fn(c);put('cfg',c);draw(2)}
const tset=(id,k,v)=>cfg(c=>{if(k=='name'&&!v.trim())return;c.teams.find(x=>x.id==id)[k]=v.trim?v.trim():v});
const upd=(id,k,v)=>cfg(c=>{if(k=='name'&&!v.trim())return;c.players.find(x=>x.id==id)[k]=v.trim?v.trim():v});
function logo(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const k=96/Math.max(im.width,im.height);
  c.getContext('2d').drawImage(im,(96-im.width*k)/2,(96-im.height*k)/2,im.width*k,im.height*k);tset(id,'logo',c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)}
const plDL=()=>`<datalist id="pls">${S.cfg.players.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>`;
const rlist=r=>r==null?rlist(DEF.rules):typeof r=='string'?r.split('\n').map(x=>x.trim()).filter(Boolean):Object.values(r);
const rs=c=>c.rules=rlist(c.rules);
const rAdd=()=>cfg(c=>{rs(c).push('')});
const rSet=(i,v)=>cfg(c=>{rs(c)[i]=v.trim()});
const rDel=i=>cfg(c=>{rs(c).splice(i,1);if(!c.rules.length)c.rules=['']});
const rMv=(i,d)=>cfg(c=>{const a=rs(c),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]});
const rBulk=mode=>{const L=$('#rbulk').value.split('\n').map(x=>x.replace(/^\s*(\d+\s*[.)]|[-•*])\s*/,'').trim()).filter(Boolean);
 if(!L.length)return alert('Paste your rules first, one per line');
 if(mode=='replace'&&!confirm('Replace ALL current rules with these '+L.length+' rules?'))return;
 cfg(c=>{c.rules=mode=='replace'?L:rlist(c.rules).concat(L)});alert(L.length+' rules '+(mode=='replace'?'saved':'added'))};
const rReset=()=>{if(confirm('Replace all rules with the default list?'))cfg(c=>{c.rules=rlist(DEF.rules)})};
const sched=c=>c.sched=Object.values(c.sched||{});
const sAdd=()=>cfg(c=>{sched(c).push({time:'',turf:'',t1:'',t2:'',note:'',ump:''})});
const sSet=(i,k,v)=>cfg(c=>{const x=sched(c)[i];v=(v||'').trim();
 if((k=='t1'&&v&&v==x.t2)||(k=='t2'&&v&&v==x.t1)){alert('Pick two different teams');return}x[k]=v});
const sDel=i=>cfg(c=>{sched(c).splice(i,1)});
const sMv=(i,d)=>cfg(c=>{const a=sched(c),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]});
const tsel=(sel,fn)=>`<select onchange="${fn}" style="width:100%"><option value="">— team —</option>${S.cfg.teams.map(t=>`<option value="${t.id}" ${t.id==sel?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
function schedEd(c){const L=Object.values(c.sched||{});
 return `${plDL()}<section class="card"><div class="th">RULES</div><p class="hint">Edit, add, delete or reorder rules. Everyone sees the changes in the Rules &amp; Schedule tab.</p>
 ${rlist(c.rules).concat(rlist(c.rules).length?[]:['']).map((x,i)=>`<div class="row"><span class="mut" style="width:22px">${i+1}.</span><textarea rows="2" placeholder="Type a rule" onchange="rSet(${i},this.value)" style="flex:1;min-width:150px;min-height:48px;resize:vertical">${esc(x)}</textarea><button class="sm" onclick="rMv(${i},-1)">↑</button><button class="sm" onclick="rMv(${i},1)">↓</button><button class="sm" onclick="rDel(${i})">✕</button></div>`).join('')}
 <div class="btns" style="grid-template-columns:1fr 1fr"><button class="on" onclick="rAdd()">＋ Add rule</button><button class="sm" onclick="rReset()">Reset to default</button></div>
 <details style="margin-top:12px"><summary class="mut">Paste a long list of rules</summary>
 <p class="mut" style="font-size:12px;margin-top:8px">One rule per line. Numbers or bullets at the start of a line (1. / 2) / - / •) are removed automatically.</p>
 <textarea id="rbulk" style="min-height:180px;margin-top:8px" placeholder="Paste all your rules here, one per line"></textarea>
 <div class="btns" style="grid-template-columns:1fr 1fr"><button class="sm on" onclick="rBulk('add')">Add to existing rules</button><button class="sm" onclick="rBulk('replace')">Replace all rules</button></div></details></section>
 <section class="card"><div class="th">TENTATIVE SCHEDULE</div><p class="hint">Type the time (like 10.00-10.45), then pick the turf and the two teams. For a break, leave the teams empty and write it in the note.</p>
 ${L.map((x,i)=>`<div style="background:var(--box);border-radius:16px;padding:12px;margin-top:10px">
  <div class="row" style="margin:0"><input value="${esc(x.time)}" placeholder="10.00-10.45" onchange="sSet(${i},'time',this.value)" style="width:150px;font-weight:800">
  <select onchange="sSet(${i},'turf',this.value)"><option value="">— turf —</option><option value="A" ${x.turf=='A'?'selected':''}>Turf A</option><option value="B" ${x.turf=='B'?'selected':''}>Turf B</option></select>
  <span style="flex:1"></span><button class="sm" onclick="sMv(${i},-1)">↑</button><button class="sm" onclick="sMv(${i},1)">↓</button><button class="sm" onclick="sDel(${i})">✕</button></div>
  <div class="sel"><div><label>Team 1</label>${tsel(x.t1,`sSet(${i},'t1',this.value)`)}</div><div><label>Team 2</label>${tsel(x.t2,`sSet(${i},'t2',this.value)`)}</div></div>
  <input value="${esc(x.note)}" placeholder="Note (optional) — e.g. Semi-final, Lunch break" onchange="sSet(${i},'note',this.value)" style="width:100%;margin-top:8px">
  <input list="pls" value="${esc(x.ump||'')}" placeholder="Leg umpire (optional)" onchange="sSet(${i},'ump',this.value)" style="width:100%;margin-top:8px"></div>`).join('')}
 <div class="btns" style="grid-template-columns:1fr"><button class="on" onclick="sAdd()">＋ Add time slot</button></div></section>`}
function delP(id){const p=P(id);if(confirm('Remove '+p.name+' from the squad?'))cfg(c=>c.players=c.players.filter(x=>x.id!=id))}
function addP(){const n=$('#np').value.trim();if(!n)return alert('Type the player name first');
 cfg(c=>c.players.push({id:'p'+Date.now().toString(36),name:n,g:$('#ng').value,team:$('#nt').value}));$('#np').focus()}
function bulk(){const bad=[],add=[];$('#bulk').value.split('\n').map(l=>l.split(/[,\t]/).map(x=>x.trim())).filter(a=>a[0]).forEach((a,i)=>{
  const q=(a[2]||'').toLowerCase(),t=S.cfg.teams.find(t=>q&&(t.name.toLowerCase()==q||t.name.toLowerCase().includes(q)));
  t?add.push({id:'p'+Date.now().toString(36)+i,name:a[0],g:/^f/i.test(a[1]||'')?'F':'M',team:t.id}):bad.push(a[0])});
 if(bad.length)return alert('Team not recognised for: '+bad.join(', ')+'. Use: Name, M or F, Team name');
 cfg(c=>c.players.push(...add));alert(add.length+' players added')}
function clearAll(){if(confirm('Delete ALL matches and stats? Players and teams are kept.'))put('matches',null)}
function setup(){const c=S.cfg,cnt=(id,g)=>c.players.filter(p=>p.team==id&&p.g==g).length,
 tm=c.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
 return `<div id="setup" style="display:grid;gap:14px"><section class="card"><div class="th">ADD A PLAYER</div>
 <p class="hint">Changes save automatically and appear on every device straight away.</p>
 <div class="sel"><div><label>Name</label><input id="np" placeholder="Player name" style="width:100%"></div>
 <div><label>Gender</label><select id="ng"><option value="M">Male</option><option value="F">Female</option></select></div>
 <div><label>Team</label><select id="nt">${tm}</select></div></div>
 <div class="btns" style="grid-template-columns:1fr"><button class="on" onclick="addP()">＋ Add Player</button></div>
 <details style="margin-top:12px"><summary class="mut">Add many at once (paste a list)</summary>
 <textarea id="bulk" style="min-height:110px;margin-top:8px" placeholder="Name, M or F, Team name&#10;one player per line"></textarea><button class="sm" onclick="bulk()">Add these players</button></details></section>
 ${c.teams.map(t=>`<section class="card" style="--c:${t.color}"><div class="row" style="margin:0 0 6px"><input type="color" value="${t.color}" onchange="tset('${t.id}','color',this.value)" style="padding:2px;width:46px;height:42px">
 <input value="${esc(t.name)}" onchange="tset('${t.id}','name',this.value)" style="flex:1;font-weight:800"><label class="lbl">${t.logo?'Change logo':'Add logo'}<input type="file" accept="image/*" hidden onchange="logo('${t.id}',this)"></label>${t.logo?`<button class="sm" onclick="tset('${t.id}','logo','')">✕ logo</button>`:''}<span class="pill">${cnt(t.id,'F')}F · ${cnt(t.id,'M')}M</span></div>
 ${c.players.filter(p=>p.team==t.id).map(p=>`<div class="row"><input value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)" style="flex:1;min-width:130px">
 <button class="sm ${p.g=='F'?'on':''}" onclick="upd('${p.id}','g','${p.g=='F'?'M':'F'}')">${p.g=='F'?'♀ F':'♂ M'}</button>
 <select onchange="upd('${p.id}','team',this.value)">${tm.replace('value="'+t.id+'"','value="'+t.id+'" selected')}</select><button class="sm" onclick="delP('${p.id}')">✕</button></div>`).join('')}</section>`).join('')}
${schedEd(c)}
 <section class="card"><button class="sm" onclick="clearAll()">Reset all matches &amp; stats</button></section></div>`}

/* ===== RULES & SCHEDULE ===== */
const info=()=>{const c=S.cfg,rl=rlist(c.rules),sc=Object.values(c.sched||{}).filter(x=>x.time||x.t1||x.t2||x.note);let n=0;
 const row=x=>{const two=x.t1&&x.t2,tm=id=>`<span class="dot" style="--c:${T(id).color}"></span><strong>${esc(T(id).name)}</strong>`;
  const top=two?`<span class="pill" style="margin-right:8px">Match ${++n}</span>${tm(x.t1)} <span class="mut">vs</span> ${tm(x.t2)}`:x.t1||x.t2?tm(x.t1||x.t2):`<strong>${esc(x.note||'—')}</strong>`;
  const sub=[x.turf?'Turf '+x.turf:'',x.ump?'Leg umpire: '+x.ump:'',two||x.t1||x.t2?x.note:''].filter(Boolean).map(esc).join(' · ');
  return `<div class="sch"><b>${esc(x.time||'TBA')}</b><div>${top}${sub?`<div class="mut" style="font-size:13px;margin-top:3px">${sub}</div>`:''}</div></div>`};
 return `<div class="grid"><section class="card"><div class="th"><span>RULES</span>${admin()?'<a class="np" href="#setup" style="padding:6px 14px;font-size:13px">✎ Edit</a>':''}</div>${rl.length?`<ol class="rl">${rl.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="mut" style="margin-top:14px">Rules will be posted soon.</p>'}</section>
 <section class="card"><div class="th"><span>TENTATIVE SCHEDULE</span>${admin()?'<a class="np" href="#setup" style="padding:6px 14px;font-size:13px">✎ Edit</a>':''}</div>${sc.length?sc.map(row).join(''):'<p class="mut" style="margin-top:14px">Schedule will be posted soon.</p>'}
 <p class="mut" style="margin-top:10px;font-size:12px">Timings are tentative and may change on the day.</p></section></div>`};

/* ===== ROUTER ===== */
const norm=()=>{const c=S.cfg||DEF;S.cfg={teams:c.teams||DEF.teams,players:(c.players&&c.players.length)?c.players:DEF.players,rules:rlist(c.rules),sched:c.sched||[]}};
function adm2(){if(admin()){delete localStorage.adm;location.hash='live';draw(2)}else location.hash='a'}
function draw(keep){
 norm();
 const h=v(),adm=['a','b','bonus','setup','awards'].includes(h);
 if(adm&&!admin()){if(prompt('Admin PIN')==PIN)localStorage.adm='1';else{location.hash='live';return}}
 const tabs=[['live','Live'],['table','Table'],['info','Rules & Schedule'],...(admin()?[['a','Turf A'],['b','Turf B'],['bonus','Bonus'],['setup','Setup'],['awards','Awards']]:[])];
 $('#nav').innerHTML=tabs.map(([k,l])=>`<a href="#${k}" class="np ${h==k?'on':''}">${l}</a>`).join('');
 const all=ms(),lvN=all.filter(m=>m.status=='live').length;
 $('#stats').innerHTML=`<div><b>${all.filter(m=>m.status=='done').length}</b>Played</div><div><b>${lvN}</b>Live now</div><div><b>${all.reduce((a,m)=>a+calc(m,1).r+calc(m,2).r,0)}</b>Total runs</div>`;
 $('#lv').style.display=lvN?'':'none';$('#abtn').textContent=admin()?'Admin logout':'Admin login';
 const sy=$('#sync');sy.className='sync'+((sy.textContent||'').includes('LIVE')?' ok':'');
 $('#adm').style.display=admin()?'none':'';
 if(h=='setup'&&keep!==2&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#setup'))return;
 const f=document.activeElement;if(f&&/^(SELECT|INPUT|TEXTAREA)$/.test(f.tagName)&&adm&&!keep)return;
 const fq=document.activeElement&&document.activeElement.id=='fq',fp=fq?document.activeElement.selectionStart:0;
 $('#app').innerHTML=h=='table'?table():h=='awards'?awards():h=='info'?info():h=='a'?scorer('A'):h=='b'?scorer('B'):h=='bonus'?bonusView():h=='setup'?setup():live();
 if(fq){const e=$('#fq');if(e){e.focus();e.setSelectionRange(fp,fp)}}
}
addEventListener('hashchange',()=>draw());draw();
</script></body></html>
